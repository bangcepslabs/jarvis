[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-core"
version = "0.5.2"
description = "Extensible personal AI assistant core"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "pydantic-settings>=2.6,<3.0", "httpx>=0.27,<1.0", "psutil>=6.0,<8.0", "docker>=7.0,<8.0", "faster-whisper>=1.2,<2.0", "python-multipart>=0.0.9,<1.0", "sherpa-onnx>=1.13,<2.0", "sounddevice>=0.5,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
