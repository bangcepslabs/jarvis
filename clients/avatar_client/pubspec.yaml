  sdk: ^3.12.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  cross_file: ^0.3.4+2
  record: ^6.1.2
  audioplayers: ^6.5.0
